name: Validar desenvolvimento

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  flutter:
    name: Validação Flutter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
      # Confirma que SUPABASE_URL/SUPABASE_PUBLISHABLE_KEY realmente
      # apontam para um projeto Supabase no ar, sem nunca imprimir o
      # valor deles no log. Pego numa versão publicada com um Secret
      # apontando para um projeto que não existia mais: o build passava
      # normal (nada aqui valida isso em tempo de compilação), e só
      # quebrava no aparelho da pessoa, na hora de fazer login.
      - name: Confirmar conexão com o Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "Secrets do Supabase não configurados — pulando checagem."
            exit 0
          fi
          if curl -sf -o /dev/null --max-time 15 \
              -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \
              "$SUPABASE_URL/auth/v1/settings"; then
            echo "Conectou no Supabase configurado."
          else
            echo "Não conseguiu conectar no Supabase configurado — confira o Secret SUPABASE_URL (projeto pausado, apagado ou endereço errado)."
            exit 1
          fi
      - name: Compilar APK de teste
        run: >
          flutter build apk --debug
          --dart-define=UPDATE_REPOSITORY=${{ github.repository }}
          --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          --dart-define=SUPABASE_PUBLISHABLE_KEY=${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: fluxo-plus-dev-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7

  windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Compilar Windows de teste
        shell: pwsh
        run: |
          flutter build windows --debug `
            --dart-define=UPDATE_REPOSITORY=${{ github.repository }} `
            --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} `
            --dart-define=SUPABASE_PUBLISHABLE_KEY=${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      - name: Compactar build de teste
        shell: pwsh
        run: >
          Compress-Archive
          -Path build/windows/x64/runner/Debug/*
          -DestinationPath fluxo-plus-dev-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: fluxo-plus-dev-windows
          path: fluxo-plus-dev-windows.zip
          retention-days: 7

  linux:
    name: Build Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Instalar dependências do build Linux
        run: |
          sudo apt-get update -y
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev \
            libsecret-1-dev libjsoncpp-dev
      - run: flutter config --enable-linux-desktop
      - run: flutter pub get
      - name: Compilar Linux de teste
        run: >
          flutter build linux --debug
          --dart-define=UPDATE_REPOSITORY=${{ github.repository }}
          --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          --dart-define=SUPABASE_PUBLISHABLE_KEY=${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      - name: Compactar build de teste
        run: |
          tar -C build/linux/x64/debug/bundle -czf fluxo-plus-dev-linux.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: fluxo-plus-dev-linux
          path: fluxo-plus-dev-linux.tar.gz
          retention-days: 7
